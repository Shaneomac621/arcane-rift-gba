name: Build ARCANE RIFT GBA

on:

  workflow_dispatch:

  push:

    branches: [main]

permissions:

  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Check out source

        uses: actions/checkout@v4

      - name: Compile GBA ROM

        run: |

          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work devkitpro/devkitarm:latest bash -lc 'export PATH=/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH; arm-none-eabi-gcc -mthumb -mthumb-interwork -mcpu=arm7tdmi -O2 -Wall -I/opt/devkitpro/libgba/include main.c -L/opt/devkitpro/libgba/lib -specs=gba.specs -lgba -o arcane-rift.elf && arm-none-eabi-objcopy -O binary arcane-rift.elf arcane-rift.gba && gbafix arcane-rift.gba -tARCANERIFT -cARCE -m00 && test -s arcane-rift.gba'

      - name: Upload GBA ROM

        uses: actions/upload-artifact@v4

        with:

          name: ARCANE-RIFT-GBA

          path: arcane-rift.gba

          if-no-files-found: error
