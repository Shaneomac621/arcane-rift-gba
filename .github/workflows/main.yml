name: Build ARCANE RIFT GBA

on:

  workflow_dispatch:

  push:

    branches: [main]

permissions:

  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Check out source

        uses: actions/checkout@v4

      - name: Compile GBA ROM

        run: |

          docker run --rm \

            -v "$GITHUB_WORKSPACE:/work" \

            -w /work \

            devkitpro/devkitarm:latest \

            bash -lc '

              dkp-pacman -Sy --noconfirm gba-dev

              export DEVKITPRO=/opt/devkitpro

              export DEVKITARM=$DEVKITPRO/devkitARM

              "$DEVKITARM/bin/arm-none-eabi-gcc" \

                -mthumb -mthumb-interwork -mcpu=arm7tdmi \

                -O2 -Wall \

                -I"$DEVKITPRO/libgba/include" \

                main.c \

                -L"$DEVKITPRO/libgba/lib" \

                -specs=gba.specs -lgba \

                -o arcane-rift.elf

              "$DEVKITARM/bin/arm-none-eabi-objcopy" \

                -O binary arcane-rift.elf arcane-rift.gba

              "$DEVKITARM/bin/gbafix" arcane-rift.gba \

                -tARCANERIFT -cARCE -m00

              test -s arcane-rift.gba

            '

      - name: Upload playable ROM

        uses: actions/upload-artifact@v4

        with:

          name: ARCANE-RIFT-GBA

          path: arcane-rift.gba

          if-no-files-found: error
